[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-engine"
version = "0.1.0"
description = "Production vLLM engine configurations, router proxies, and SLA benchmarking tools."
authors = [{ name = "Aravind Sundaresan" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0"
]

[project.scripts]
vllm-bench = "vllm_engine.cli:app"

[tool.setuptools.packages.find]
where = ["."]
