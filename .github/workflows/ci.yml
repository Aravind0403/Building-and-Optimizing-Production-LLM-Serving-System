name: AetherControl CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Python Test Suites & Pre-flight Dataset Inspection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pydantic pyyaml typer rich requests

      - name: Test & Validate trainsight (Shift-Left Pre-Flight Check)
        run: |
          cd trainsight
          pip install -e .
          pytest
          # Shift-Left CI validation: Fail CI build if dataset quality checks fail (--strict)
          trainsight profile --dataset sample_data/sample_sft.jsonl --type sft --strict
          trainsight profile --dataset sample_data/sample_dpo.jsonl --type dpo --strict
          trainsight profile --dataset sample_data/sample_gsm8k.jsonl --type sft --strict

      - name: Test vllm-engine
        run: |
          cd vllm-engine
          pip install -e .
          pytest

      - name: Test rlhf-pipeline
        run: |
          cd rlhf-pipeline
          pip install -e .
          pytest
